---
# tasks file for aiopslab

- name: Validate aiopslab_state
  ansible.builtin.assert:
    that:
      - aiopslab_state in ['present', 'absent']
    fail_msg: "aiopslab_state (AIOPSLAB_STATE) must be 'present' or 'absent', got '{{ aiopslab_state }}'"

- name: Validate aiopslab_target
  ansible.builtin.assert:
    that:
      - aiopslab_target in ['k3s', 'kind']
    fail_msg: "aiopslab_target must be 'k3s' or 'kind', got '{{ aiopslab_target }}'"

- name: Install AIOpsLab
  when: aiopslab_state == 'present'
  ansible.builtin.include_tasks: install.yml

- name: Remove AIOpsLab
  when: aiopslab_state == 'absent'
  ansible.builtin.include_tasks: uninstall.yml
