---
# tasks file for syncthing

- name: Ensure Syncthing compose directory exists
  ansible.builtin.file:
    path: "{{ syncthing_compose_dir }}"
    state: directory
    owner: "{{ syncthing_user }}"
    group: "{{ syncthing_user }}"
    mode: '0755'

- name: Ensure Syncthing config directory exists
  ansible.builtin.file:
    path: "{{ syncthing_compose_dir }}/config"
    state: directory
    owner: "{{ syncthing_user }}"
    group: "{{ syncthing_user }}"
    mode: '0755'

- name: Ensure Syncthing data directory exists
  ansible.builtin.file:
    path: "{{ syncthing_compose_dir }}/data"
    state: directory
    owner: "{{ syncthing_user }}"
    group: "{{ syncthing_user }}"
    mode: '0755'

- name: Deploy docker-compose.yml for Syncthing
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ syncthing_compose_dir }}/docker-compose.yml"
    owner: "{{ syncthing_user }}"
    group: "{{ syncthing_user }}"
    mode: '0644'

- name: Deploy Syncthing container with Docker Compose v2
  community.docker.docker_compose_v2:
    project_src: "{{ syncthing_compose_dir }}"
    state: present
  become: true
  become_user: "{{ syncthing_user }}"
