---
- name: Check that the namespace of krkn may be deleted
  ansible.builtin.assert:
    that: krkn_namespace not in krkn_protected_namespaces
    fail_msg: >-
      Refusing to delete the namespace {{ krkn_namespace }}, it is used by other workloads.
      Install krkn in its own namespace or run with -e krkn_remove_namespace=false
    quiet: true
  when: krkn_remove_namespace | bool

- name: Read the Helm release of krkn
  ansible.builtin.import_tasks: read_release.yml

- name: Uninstall the Helm release of the krkn operator
  ansible.builtin.command:
    cmd: >-
      helm uninstall {{ krkn_release_name }}
      --namespace {{ krkn_namespace }} --wait --timeout {{ krkn_wait_timeout }}
  environment: "{{ krkn_kube_env }}"
  changed_when: true
  when: krkn_deployed_release | length > 0

# Helm installs the CRDs of the crds/ directory of the chart but never deletes them again, so without this the
# custom resources of krkn (users, targets, scenario and graph runs) would survive the uninstall.
- name: List the custom resource definitions of krkn
  ansible.builtin.command:
    cmd: kubectl get customresourcedefinitions --output name
  environment: "{{ krkn_kube_env }}"
  register: krkn_installed_crds
  changed_when: false
  when: krkn_remove_crds | bool

- name: Delete the custom resource definitions of krkn
  ansible.builtin.command:
    cmd: "kubectl delete {{ item }} --wait=true"
  environment: "{{ krkn_kube_env }}"
  loop: >-
    {{ krkn_installed_crds.stdout_lines | default([])
       | select('search', (('.' ~ krkn_crd_group) | regex_escape) ~ '$') | list }}
  changed_when: true

- name: Look for the namespace of krkn
  ansible.builtin.command:
    cmd: "kubectl get namespace {{ krkn_namespace }} --output name"
  environment: "{{ krkn_kube_env }}"
  register: krkn_existing_namespace
  changed_when: false
  failed_when:
    - krkn_existing_namespace.rc != 0
    - '"NotFound" not in krkn_existing_namespace.stderr'
  when: krkn_remove_namespace | bool

- name: Delete the namespace of krkn
  ansible.builtin.command:
    cmd: "kubectl delete namespace {{ krkn_namespace }} --wait=true"
  environment: "{{ krkn_kube_env }}"
  changed_when: true
  when:
    - krkn_remove_namespace | bool
    - krkn_existing_namespace.rc | default(1) == 0

- name: Summarise the removal
  ansible.builtin.debug:
    msg:
      - "The Helm release {{ krkn_release_name }} is removed"
      - >-
        {{ 'The CRDs of ' ~ krkn_crd_group ~ ' are removed' if krkn_remove_crds | bool
           else 'The CRDs of ' ~ krkn_crd_group ~ ' are kept (krkn_remove_crds)' }}
      - >-
        {{ 'The namespace ' ~ krkn_namespace ~ ' is removed' if krkn_remove_namespace | bool
           else 'The namespace ' ~ krkn_namespace ~ ' is kept (krkn_remove_namespace)' }}
